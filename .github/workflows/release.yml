name: Cross-Platform Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: Check version and tag
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.tag-check.outputs.skip }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # === Extract version from package.json ===
      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # === Skip if tag already exists ===
      - name: Check for existing tag
        id: tag-check
        shell: bash
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version }} already exists."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            ext: tar.gz
          - os: macos-latest
            ext: tar.gz
          - os: windows-latest
            ext: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # === Extract version from package.json ===
      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # === FRONTEND BUILD ===
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend deps
        working-directory: .
        run: npm ci

      - name: Build frontend
        working-directory: .
        run: npm run build

      # === BACKEND BUILD ===
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend deps
        run: pip install -r requirements.txt pyinstaller

      - name: Build executable
        working-directory: .
        run: |
          pyinstaller main.spec

      # === Package artifact ===
      - name: Package binary
        id: package
        shell: bash
        run: |
          os_name="${{ matrix.os }}"
          os_name="${os_name%-latest}"
          echo "os_name=$os_name" >> "$GITHUB_OUTPUT"
          
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell Compress-Archive -Path dist\\robosub-trajectory-drawing.exe -DestinationPath robosub-trajectory-drawing-${os_name}-v${{ steps.version.outputs.version }}.zip
          else
            tar -czf robosub-trajectory-drawing-${os_name}-v${{ steps.version.outputs.version }}.tar.gz -C dist robosub-trajectory-drawing -C .. launch.sh
          fi

      - name: Upload artifact (for release aggregation)
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.package.outputs.os_name }}
          path: robosub-trajectory-drawing-${{ steps.package.outputs.os_name }}-v${{ steps.version.outputs.version }}.${{ matrix.ext }}


  release:
    needs: build
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Get version from package.json
        id: version
        run: |
          VERSION=$(jq -r .version ./package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag if missing
        run: |
          if ! git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git tag v${{ steps.version.outputs.version }}
            git push origin v${{ steps.version.outputs.version }}
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: release_assets/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
